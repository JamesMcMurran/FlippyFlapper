<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flippy Flapper in an HTML5 page</title>
  <link rel="stylesheet" href="../lib/flippy-flapper.css">
  <style>body{font:16px system-ui;margin:24px;color:#26332b}#my-magazine{width:100%;height:650px;max-width:1100px}button{padding:8px 14px;margin:12px 6px 12px 0}</style>
</head>
<body>
  <h1>My HTML5 page</h1>
  <p>Your own content can appear above and below the reader.</p>
  <div id="my-magazine"></div>
  <button id="previous" type="button">Previous</button>
  <button id="next" type="button">Next</button>
  <output id="page"></output>
  <script src="../lib/flippy-flapper.js"></script>
  <script src="../demo/manifest.js"></script>
  <script>
    const viewer = FlippyFlapper.createMagazineViewer(
      document.getElementById('my-magazine'),
      { manifest: FLIPPY_DEMO, baseUrl: new URL('../demo/', document.baseURI).href }
    );
    document.getElementById('previous').onclick = () => viewer.previous();
    document.getElementById('next').onclick = () => viewer.next();
    viewer.on('pagechange', ({state}) => {
      document.getElementById('page').textContent = 'Page ' + state.pageIndex;
    });
  </script>
</body>
</html>
